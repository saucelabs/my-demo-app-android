// Top-level build file where you can add configuration options common to all sub-projects/modules.
def localConfiguration = new Properties()
def localConfigurationFile = rootProject.file('local.properties')
if (localConfigurationFile.isFile()) {
    localConfigurationFile.withInputStream { input ->
        localConfiguration.load(input)
    }
}
ext.localConfiguration = localConfiguration

buildscript {
    ext.jacocoVersion = '0.8.4'
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url "https://www.jitpack.io" }
        maven {
            url "https://oss.sonatype.org/content/repositories/staging/"
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'
        classpath 'com.google.gms:google-services:4.3.10'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.7.1'
        classpath "org.jacoco:org.jacoco.core:$jacocoVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def sauceMobileBetaRepository = findProperty('sauceMobileBetaRepository') ?:
        localConfiguration.getProperty(
                'sauceMobileBetaRepository',
                'https://maven.testfairy.com'
        )

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        maven { url uri(sauceMobileBetaRepository) }
        maven {
            url "https://oss.sonatype.org/content/repositories/staging/"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

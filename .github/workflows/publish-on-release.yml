name: Publish APK

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        # The runner image's latest sdkmanager needs Java 17, but Gradle 7.2 / AGP 7.0.2 require JDK 11: pin cmdline-tools 9.0 (build 9477386), the newest release that runs on JDK 11.
        # The action's default package list requests the legacy 'tools' package, which Google removed — list packages explicitly.
        with:
          cmdline-tools-version: 9477386
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Detect version from release tag
        run: |
          echo "CI_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash

      - name: Set app version and bump version code
        uses: chkfung/android-version-actions@v1.1
        with:
          gradlePath: app/build.gradle
          versionCode: ${{ github.run_number }}
          versionName: ${{ env.CI_TAG }}

      - name: Compile APK
        # SDK credentials for the published APKs. app/build.gradle reads these environment variables (precedence: -P property, local.properties, env, empty).
        # Empty secrets leave the corresponding SDK disabled at runtime.
        env:
          BACKTRACE_UNIVERSE: ${{ secrets.BACKTRACE_UNIVERSE }}
          BACKTRACE_TOKEN: ${{ secrets.BACKTRACE_TOKEN }}
          SAUCE_MOBILE_BETA_TOKEN: ${{ secrets.SAUCE_MOBILE_BETA_TOKEN }}
        run: |
          if [ -n "${BACKTRACE_UNIVERSE}" ] && [ -n "${BACKTRACE_TOKEN}" ]; then
            # Android needs the JSON submission URL (the native integration derives /minidump from it).
            export BACKTRACE_SUBMISSION_URL="https://submit.backtrace.io/${BACKTRACE_UNIVERSE}/${BACKTRACE_TOKEN}/json"
          else
            echo "::warning::BACKTRACE_UNIVERSE and/or BACKTRACE_TOKEN secret is empty; Backtrace is disabled in these APKs"
          fi
          [ -n "${SAUCE_MOBILE_BETA_TOKEN}" ] || echo "::warning::SAUCE_MOBILE_BETA_TOKEN secret is empty; Sauce Mobile Beta is disabled in these APKs"
          ./gradlew app:assembleDebug
          ./gradlew app:assembleDebugAndroidTest
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mda-${{ env.CI_TAG }}-${{ github.run_number }}.apk
          mv app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/outputs/apk/debug/mda-androidTest-${{ env.CI_TAG }}-${{ github.run_number }}.apk
        shell: bash

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          name: Version ${{ env.CI_TAG }}
          tag_name: ${{ env.CI_TAG }}
          fail_on_unmatched_files: true
          prerelease: false
          files: |
            app/build/outputs/apk/debug/mda-${{ env.CI_TAG }}-${{ github.run_number }}.apk
            app/build/outputs/apk/debug/mda-androidTest-${{ env.CI_TAG }}-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Test with saucectl

on: [push]

env:
  SAUCE_USERNAME: ${{secrets.SAUCE_USERNAME}}
  SAUCE_ACCESS_KEY: ${{secrets.SAUCE_ACCESS_KEY}}

jobs:
  main:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        # The runner image's latest sdkmanager needs Java 17, but Gradle 7.2 / AGP 7.0.2 require JDK 11: pin cmdline-tools 9.0 (build 9477386), the newest release that runs on JDK 11.
        # The action's default package list requests the legacy 'tools' package, which Google removed — list packages explicitly.
        with:
          cmdline-tools-version: 9477386
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Compile
        run: |
          ./gradlew app:assembleDebug
          ./gradlew app:assembleDebugAndroidTest
        shell: bash

      - name: Test espresso with saucectl
        uses: saucelabs/saucectl-run-action@v1
        with:
          testing-environment: ""
          concurrency: 10
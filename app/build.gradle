apply plugin: 'com.android.application'
apply plugin: 'jacoco'

def localConfiguration = rootProject.ext.localConfiguration
def configuredValue = { String propertyName, String environmentName, String defaultValue ->
    def value = project.findProperty(propertyName) ?:
            localConfiguration.getProperty(propertyName) ?:
            System.getenv(environmentName) ?:
            defaultValue
    value.toString()
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def backtraceSubmissionUrl = configuredValue(
        'backtraceSubmissionUrl',
        'BACKTRACE_SUBMISSION_URL',
        ''
)
def sauceMobileBetaToken = configuredValue(
        'sauceMobileBetaToken',
        'SAUCE_MOBILE_BETA_TOKEN',
        ''
)
def sauceEnvironment = configuredValue('sauceEnvironment', 'SAUCE_ENVIRONMENT', 'beta')
def sauceDistributionId = configuredValue(
        'sauceDistributionId',
        'SAUCE_DISTRIBUTION_ID',
        ''
)

def sauceMobileBetaAar = configuredValue('sauceMobileBetaAar', 'SAUCE_MOBILE_BETA_AAR', '').trim()
def sauceMobileBetaVersion = configuredValue(
        'sauceMobileBetaVersion',
        'SAUCE_MOBILE_BETA_VERSION',
        ''
).trim()
def sauceMobileBetaEnabled = Boolean.valueOf(sauceMobileBetaAar || sauceMobileBetaVersion)

android {
    signingConfigs {}

    compileSdkVersion 31
    buildToolsVersion "30.0.2"
    useLibrary 'org.apache.http.legacy'
    ndkVersion '21.3.6528147'

    defaultConfig {
        applicationId "com.saucelabs.mydemoapp.android"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1 // CI automatically replaces this
        versionName "1.0.0" // CI automatically replaces this
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        buildConfigField "String", "SAUCE_USERNAME", "\"${System.getenv('SAUCE_USERNAME')}\""
        buildConfigField "String", "SAUCE_ACCESS_KEY", "\"${System.getenv('SAUCE_ACCESS_KEY')}\""
        buildConfigField "String", "BACKTRACE_SUBMISSION_URL", buildConfigString(backtraceSubmissionUrl)
        buildConfigField "String", "SAUCE_MOBILE_BETA_TOKEN", buildConfigString(sauceMobileBetaToken)
        buildConfigField "String", "SAUCE_ENVIRONMENT", buildConfigString(sauceEnvironment)
        buildConfigField "String", "SAUCE_DISTRIBUTION_ID", buildConfigString(sauceDistributionId)
    }

    testOptions {
        animationsDisabled true

        unitTests {
            includeAndroidResources true
        }
    }

    buildTypes {
        debug {
            debuggable true
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    dataBinding {
        enabled = true
    }

    // Sauce Mobile Beta is a beta/debug capability. The production release
    // variant always compiles the no-op adapter and never packages the SDK.
    // Debug builds compile the real integration only when an AAR or published
    // version is explicitly supplied.
    sourceSets {
        debug.java.srcDir(
                sauceMobileBetaEnabled ? 'src/mobileBeta/java' : 'src/noMobileBeta/java'
        )
        release.java.srcDir('src/noMobileBeta/java')
    }

    lintOptions {
        checkReleaseBuilds false
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest', 'createDebugCoverageReport']) {

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.from(files([mainSrc]))
    classDirectories.from(files([debugTree]))

    executionData.from(fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ]))
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //Libraries For Testing
    androidTestImplementation 'com.saucelabs.visual:visual-espresso:0.0.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.4.0'
    androidTestImplementation("com.android.support.test.espresso:espresso-contrib:3.0.2")
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'
    implementation 'com.android.support.test.espresso:espresso-idling-resource:3.0.2'

    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'com.google.android.material:material:1.4.0'

    def room_version = "2.4.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    //Retrofit
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.guava:guava:33.0.0-android'

    // Utils
    implementation 'com.github.gcacace:signature-pad:1.3.1'
    implementation(name:'com.kyanogen.signatureview.signature-view', ext:'aar')
    implementation(name:'com.williamww.silky-signature', ext:'aar')
    implementation(name:'com.uphyca.creditcardedittext', ext:'aar')

    implementation 'com.github.GrenderG:Toasty:1.4.2'
    implementation "com.squareup.okhttp3:okhttp:4.9.0"

    // Backtrace is the sole crash owner in all variants.
    implementation 'com.github.backtrace-labs.backtrace-android:backtrace-library:3.7.0'

    // Sauce Mobile Beta is opt-in and debug-only. A direct AAR is convenient
    // while validating an unreleased SDK; a published Maven version exercises
    // the real coordinate and POM. Release builds contain neither dependency.
    if (sauceMobileBetaAar) {
        def localAar = file(sauceMobileBetaAar)
        if (!localAar.isFile()) {
            throw new GradleException("Sauce Mobile Beta AAR not found: ${localAar}")
        }

        debugImplementation files(localAar)

        // Direct AAR dependencies have no POM, so include the two external
        // runtime dependencies declared by the published artifact.
        debugImplementation 'androidx.core:core-ktx:1.3.1'
        // Must match the kotlin version the AAR is compiled with
        // (ext.kotlin_version in testfairy-android-sdk/build.gradle) — the
        // file() dependency has no POM, so these pins stand in for it.
        debugImplementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.21'
    } else if (sauceMobileBetaVersion) {
        debugImplementation(
                "com.saucelabs.mobilebeta:sauce-mobile-beta-android:${sauceMobileBetaVersion}"
        )
    }

    def camerax_version = "1.1.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "com.google.zxing:core:3.3.3"
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
